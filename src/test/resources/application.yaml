spring:
  # 테스트용 H2 인메모리 데이터베이스 설정
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  # Redis 설정 (테스트용 - 실제로는 사용하지 않지만 빈 생성을 위해 필요)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # Redis와 Kafka 자동 설정 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# JWT 설정
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256-algorithm
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 86400000  # 24시간

# Kafka Topics (테스트용)
kafka:
  topics:
    order-created: test.order.created
    point-charged: test.point.charged
    point-used: test.point.used

# 로깅 설정
logging:
  level:
    root: INFO
    kr.spartaclub.coffeeorder: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
